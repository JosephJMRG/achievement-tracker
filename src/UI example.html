<!DOCTYPE html>
<html lang="es">
<head>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #202020;
            font-family: 'Arial Black', sans-serif;
        }

        .quest-card {
            background-color: #2d3b8e;
            border: 8px solid #5c3a21;
            border-radius: 15px;
            padding: 20px;
            width: 800px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .left-side { flex: 1; }

        .title {
            color: white;
            font-size: 32px;
            text-shadow: 3px 3px 0px black;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .orbs-icon {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2px;
        }
        .orb { width: 12px; height: 12px; background: #00d4ff; border-radius: 50%; border: 1px solid #005f73; }

        .subtitle {
            color: #ffcc00;
            font-size: 24px;
            margin: 10px 0;
            text-shadow: 2px 2px 0px black;
        }

        .progress-container {
            width: 400px;
            height: 25px;
            background-color: #1a237e;
            border-radius: 10px;
            position: relative;
            overflow: hidden;
            border: 2px solid #000;
        }

        .progress-fill {
            width: 70%;
            height: 100%;
            background-color: #39ff14;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 14px;
            text-shadow: 1px 1px 0px black;
        }

        .right-side {
            text-align: center;
            color: #ffcc00;
            text-shadow: 2px 2px 0px black;
        }

        .percent { font-size: 60px; margin: 0; }
        .completed { font-size: 24px; margin: 0; }
    </style>
</head>
<body>

    <div class="quest-card">
        <div class="left-side">
            <div class="title">
                ORB COLLECTOR
                <div class="orbs-icon">
                    <div class="orb"></div><div class="orb"></div>
                    <div style="margin-left: 6px;" class="orb"></div>
                </div>
            </div>
            <div class="subtitle">COLLECT 500 MANA ORBS.</div>
            <div class="progress-container">
                <div class="progress-fill">350 / 500</div>
            </div>
        </div>
        <div class="right-side">
            <div class="percent">70%</div>
            <div class="completed">Completed</div>
        </div>
    </div>

</body>
</html>
